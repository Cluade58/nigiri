<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add a test, fits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="highlighter.css">
</head>
<body class="add-page">
<nav class="nav" aria-label="Main">
  <ul>
    <li><a href="today-b-highlighter.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      Today</a></li>
    <li><a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="13" height="13" rx="2"/><path d="M8 4h10a2 2 0 0 1 2 2v10"/></svg>
      Decks</a></li>
    <li><a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Calendar</a></li>
    <li><a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V13M12 20V8M19 20V4"/></svg>
      Progress</a></li>
  </ul>
</nav>

<div class="has-rail">
  <header class="form-bar">
    <button class="btn-text" type="button">Cancel</button>
    <h1>Add a test</h1>
    <span></span>
  </header>

  <main class="add">
    <form class="cols" id="form" novalidate>
      <div class="col-form">
        <div class="field">
          <label for="name">Test name</label>
          <input class="input" id="name" name="name" type="text" value="AP Bio unit 4 test" autocomplete="off" aria-describedby="name-error">
          <p class="field-error" id="name-error" hidden>Give the test a name</p>
        </div>

        <div class="field">
          <label for="class">Class</label>
          <div class="select-wrap">
            <span class="swatch" id="class-swatch" style="background: var(--hl-bio)" aria-hidden="true"></span>
            <select class="input" id="class" name="class">
              <option data-hl="--hl-bio" selected>AP Biology</option>
              <option data-hl="--hl-algebra">Algebra II</option>
              <option data-hl="--hl-spanish">Spanish</option>
              <option data-hl="--hl-english">English</option>
              <option data-hl="--hl-chem">Chem</option>
              <option data-hl="--hl-history">US History</option>
            </select>
            <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
          </div>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input class="input" id="date" name="date" type="text" value="Fri, Nov 13" autocomplete="off" aria-describedby="date-help date-error">
          <p class="helper" id="date-help">in 3 days</p>
          <p class="field-error" id="date-error" hidden>Pick the test date</p>
        </div>

        <fieldset class="field" id="decks" aria-describedby="decks-error">
          <legend>Decks for this test</legend>
          <div class="chips">
            <button class="chip" type="button" aria-pressed="false"><svg class="check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>Unit 3</button>
            <button class="chip" type="button" aria-pressed="true"><svg class="check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>Unit 4: Cell energy</button>
            <button class="chip" type="button" aria-pressed="false"><svg class="check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>Unit 5</button>
          </div>
          <p class="field-error" id="decks-error" hidden>Pick at least one deck</p>
        </fieldset>

        <fieldset class="field">
          <legend>Goal</legend>
          <div class="segment">
            <label><input type="radio" name="goal" value="80">80%</label>
            <label><input type="radio" name="goal" value="85">85%</label>
            <label><input type="radio" name="goal" value="90" checked>90%</label>
            <label><input type="radio" name="goal" value="95">95%</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="minutes">Minutes a day</label>
          <div class="stepper">
            <button class="step" type="button" id="fewer" aria-label="Fewer minutes" aria-controls="minutes">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg>
            </button>
            <input class="input" id="minutes" name="minutes" type="text" inputmode="numeric" value="15">
            <button class="step" type="button" id="more" aria-label="More minutes" aria-controls="minutes">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg>
            </button>
            <span class="unit">min</span>
          </div>
        </div>
      </div>

      <div class="col-result">
        <section class="fit" aria-labelledby="fit-title">
          <h2 class="t-section" id="fit-title">On track</h2>
          <p class="lede">About 12 min a day fits your 15.</p>

          <div class="meter" style="--hl: var(--hl-bio); --hatch: var(--hatch-bio); --goal: 90%" role="img"
               aria-label="Readiness 74% now, 90% by Friday with the plan. Goal 90%.">
            <span class="goal-label" aria-hidden="true">90% goal</span>
            <div class="strip">
              <svg class="stroke" viewBox="0 0 1000 28" preserveAspectRatio="none" aria-hidden="true">
                <path d="M3,4 C140,2 290,5 440,3 C560,2 660,5 727,3 L737,5 L733,9 L740,13 L735,17 L741,21 L736,25 L725,26 C600,24 450,27 300,25 C180,24 80,26 2,25 C0,18 1,10 3,4 Z"/>
              </svg>
              <div class="plan" style="left: 73.6%; width: 16.4%"></div>
            </div>
            <span class="tick" aria-hidden="true"></span>
          </div>

          <p class="readiness" role="status" aria-live="polite">74% ready now. <span>90% by Friday.</span></p>
          <p class="t-secondary coverage">1 deck, 60 cards, 18 not started yet.</p>
        </section>

        <button class="btn btn-primary" type="submit">Add test</button>
      </div>
    </form>
  </main>
</div>
<script>
  // Demo only: toggles and inline validation. No data is saved.
  const $ = (s) => document.querySelector(s);

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      chip.setAttribute("aria-pressed", String(chip.getAttribute("aria-pressed") !== "true"));
    });
  });

  $('#class').addEventListener('change', (e) => {
    $('#class-swatch').style.background = `var(${e.target.selectedOptions[0].dataset.hl})`;
  });

  const minutes = $('#minutes');
  const step = (d) => { minutes.value = Math.min(120, Math.max(5, (parseInt(minutes.value, 10) || 15) + d)); };
  $('#fewer').addEventListener('click', () => step(-5));
  $('#more').addEventListener('click', () => step(5));

  function showError(input, errorEl, problem) {
    errorEl.hidden = !problem;
    if (input.matches('input')) input.setAttribute('aria-invalid', String(problem));
    return problem;
  }

  $('#form').addEventListener('submit', (e) => {
    e.preventDefault();
    const problems = [];
    if (showError($('#name'), $('#name-error'), !$('#name').value.trim())) problems.push($('#name'));
    if (showError($('#date'), $('#date-error'), !$('#date').value.trim())) problems.push($('#date'));
    const anyDeck = document.querySelector('.chip[aria-pressed="true"]');
    if (showError($('#decks'), $('#decks-error'), !anyDeck)) problems.push(document.querySelector('.chip'));
    if (problems.length) problems[0].focus();
  });
</script>
</body>
</html>
