<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today, bubble sheet direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #FFFFFF;
    --green: #2E8B6A;          /* structure, primary fill */
    --green-line: #2E8B6A;     /* printed bubble outlines */
    --green-text: #24705A;     /* small green text, AA on white and tint */
    --tint: #E6F2EC;
    --graphite: #3A3D42;       /* filled bubbles and text */
    --on-graphite: #FFFFFF;
    --ink: #3A3D42;
    --ink-2: #5A5F66;
    --on-green: #FFFFFF;
    --bio: #2E8B6A;
    --algebra: #3B6FD9;
    --spanish: #D9485F;
    --english: #C27A12;
    --chem: #7A5BC7;
    --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 32px;
    --nav-h: 64px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #15191C;
      --tint: #1E2B26;
      --graphite: #D8DCE0;
      --on-graphite: #15191C;
      --ink: #E4E7EA;
      --ink-2: #A9B0B6;
      --green-line: #4FB58F;
      --green-text: #6CC7A4;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Barlow", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  h1, h2, h3, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .cond { font-family: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: var(--s4) var(--s3) calc(var(--nav-h) + var(--s5) + env(safe-area-inset-bottom));
  }
  .top { margin-bottom: var(--s4); }
  .top h1 { font-family: "Barlow Semi Condensed", "Barlow", sans-serif; font-size: 22px; font-weight: 600; line-height: 1.2; }
  .top p { font-size: 15px; color: var(--ink-2); margin-top: var(--s1); }
  .grid { display: grid; gap: var(--s5); }
  .side { display: grid; gap: var(--s5); align-content: start; }

  /* ---------- Hero on the form tint ---------- */
  .hero { background: var(--tint); border-radius: 12px; padding: var(--s3); }
  .hero h2 { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .when-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-top: var(--s1); }
  .when { font-size: 15px; color: var(--ink-2); }
  .pct { font-size: 56px; font-weight: 700; line-height: 1; margin-top: 12px; color: var(--graphite); }
  .pct small { font-size: 15px; font-weight: 500; font-family: "Barlow", sans-serif; color: var(--ink-2); margin-left: var(--s1); letter-spacing: 0; }

  /* Five day bubbles: filled = studied for this test that day. */
  .week { display: flex; gap: var(--s1); flex: none; }
  .choice {
    display: grid; place-items: center;
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--green-line);
    font-family: "Barlow Semi Condensed", sans-serif; font-size: 12px; font-weight: 600; line-height: 1;
    color: var(--green-text);
  }
  .choice.done { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
  .choice.test { border-width: 2.5px; }

  .sheet { margin-top: var(--s4); }
  .bubbles, .marks {
    display: grid;
    grid-template-columns: repeat(20, minmax(0, 14px));
    column-gap: 2px;
  }
  .marks { height: 18px; font-size: 13px; color: var(--green-text); line-height: 18px; }
  /* Label centred over bubble 18, the 90% goal. */
  .marks .goal { grid-column: 18; justify-self: center; white-space: nowrap; }
  /* The goal label sits in the 24px gap on the right, clear of "74%" on the left. */
  .sheet { position: relative; }
  .marks.above { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); }
  .b {
    position: relative;
    aspect-ratio: 1; border-radius: 50%;
    border: 1.5px solid var(--green-line);
  }
  .b.on { background: var(--graphite); border-color: var(--graphite); }
  /* Projected with 15 min a day: solid green at 35%, never dashed. */
  .b.next, .legend { background: color-mix(in srgb, var(--green-line) 35%, transparent); }
  /* Goal: a 2px tick from the label down to bubble 18. Bubble itself stays empty. */
  .b.goal::before {
    content: ""; position: absolute; left: 50%; bottom: calc(100% + 1px);
    width: 2px; height: 5px; margin-left: -1px; background: var(--graphite);
  }

  .readiness { margin-top: var(--s3); text-wrap: balance; }
  .readiness > span { color: var(--ink-2); display: inline-block; }
  .legend {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    border: 1.5px solid var(--green-line); vertical-align: -1px; margin-right: 6px;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 var(--s4);
    font: inherit; font-family: "Barlow", sans-serif; font-size: 19px; font-weight: 700;
    border-radius: 999px; cursor: pointer;
  }
  .btn-primary { width: 100%; height: 52px; margin-top: var(--s3); background: var(--green); color: var(--on-green); border: 0; }
  .btn-secondary { background: transparent; color: var(--green-text); border: 1.5px solid var(--green-line); }

  .also { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3); font-size: 15px; color: var(--ink-2); }
  .also strong { color: var(--ink); font-weight: 600; }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }

  /* ---------- Plain answer rows ---------- */
  .sec h2 { font-family: "Barlow Semi Condensed", sans-serif; font-size: 22px; font-weight: 600; line-height: 1.2; }
  .reviews { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .reviews p { font-size: 15px; color: var(--ink-2); margin-top: var(--s1); }

  .rows { margin-top: var(--s2); border-top: 1px solid var(--tint); }
  .rows li { border-bottom: 1px solid var(--tint); }
  .row {
    display: grid; grid-template-columns: 22px 1fr auto; align-items: center;
    gap: var(--s3); min-height: 64px; padding: var(--s2) 0; cursor: pointer;
  }
  .row input {
    appearance: none; -webkit-appearance: none; margin: 0;
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--green-line); background: transparent; cursor: pointer;
    transition: background-color 120ms ease-out;
  }
  .row input:checked { background: var(--graphite); border-color: var(--graphite); }
  .row .title { display: block; font-size: 17px; line-height: 1.3; }
  .row .subj { display: flex; align-items: center; gap: var(--s2); font-size: 13px; color: var(--ink-2); }
  .row .subj .dot { width: 8px; height: 8px; }
  .row .due { font-size: 15px; color: var(--ink-2); }
  .row:has(input:checked) .title { text-decoration: line-through; color: var(--ink-2); }

  /* ---------- Nav ---------- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--page); border-top: 1px solid var(--tint);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav ul { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; }
  .nav a {
    display: grid; justify-items: center; align-content: center; gap: 2px;
    height: var(--nav-h); color: var(--ink-2); text-decoration: none; font-size: 13px;
  }
  .nav a[aria-current="page"] { color: var(--green-text); font-weight: 700; }
  .nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  @media (min-width: 480px) {
    .bubbles, .marks { column-gap: 4px; }
  }
  @media (min-width: 1024px) {
    .nav { top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--tint); padding: 0 var(--s5); }
    .nav ul { max-width: 1040px; display: flex; gap: var(--s4); }
    .nav a { display: flex; align-items: center; gap: var(--s2); font-size: 15px; padding: 0 var(--s2); box-shadow: inset 0 -3px 0 transparent; }
    .nav a[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--green-line); }
    .nav svg { width: 20px; height: 20px; }
    .page { max-width: 1104px; padding: calc(var(--nav-h) + var(--s5)) var(--s5) var(--s5); }
    .top { margin-bottom: var(--s5); }
    .top h1 { font-size: 28px; }
    .grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 56px; align-items: start; }
    .hero { padding: var(--s5); }
    .hero h2 { font-size: 26px; }
    .pct { font-size: 72px; }
    .btn-primary { width: auto; min-width: 220px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <ul>
    <li><a href="#" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      Today</a></li>
    <li><a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="13" height="13" rx="2"/><path d="M8 4h10a2 2 0 0 1 2 2v10"/></svg>
      Decks</a></li>
    <li><a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Calendar</a></li>
    <li><a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V13M12 20V8M19 20V4"/></svg>
      Progress</a></li>
  </ul>
</nav>

<main class="page">
  <header class="top">
    <h1>Tuesday, Nov 10</h1>
    <p>12-day streak, 2 repairs left</p>
  </header>

  <div class="grid">
    <section class="hero" aria-labelledby="test-title">
      <h2 id="test-title" class="cond">AP Bio unit 4 test</h2>
      <div class="when-row">
        <p class="when">Friday, in 3 days</p>
        <div class="week" role="img" aria-label="This week: studied for this test on Monday; Tuesday, Wednesday and Thursday not yet; test on Friday">
          <span class="choice done">M</span>
          <span class="choice">T</span>
          <span class="choice">W</span>
          <span class="choice">T</span>
          <span class="choice test">F</span>
        </div>
      </div>
      <p class="pct cond" aria-hidden="true">74%<small>ready</small></p>

      <!-- One bubble per 5%, rounded down: 74% = 14, 88% = 17, goal 90% = bubble 18. -->
      <div class="sheet" role="img" aria-label="Readiness: 14 of 20 bubbles filled for 74%. 3 more, up to 17, with 15 minutes a day for 88%. Goal is bubble 18, 90%.">
        <div class="marks above" aria-hidden="true"><span class="goal">90% goal</span></div>
        <div class="bubbles" aria-hidden="true">
          <span class="b on"></span><span class="b on"></span><span class="b on"></span><span class="b on"></span><span class="b on"></span>
          <span class="b on"></span><span class="b on"></span><span class="b on"></span><span class="b on"></span><span class="b on"></span>
          <span class="b on"></span><span class="b on"></span><span class="b on"></span><span class="b on"></span><span class="b next"></span>
          <span class="b next"></span><span class="b next"></span><span class="b goal"></span><span class="b"></span><span class="b"></span>
        </div>
      </div>

      <p class="readiness">74% ready now. <span><span class="legend" aria-hidden="true"></span>88% if you do 15 min a day.</span></p>
      <button class="btn btn-primary" type="button">Study for it</button>
      <p class="also"><span class="dot" style="background: var(--spanish)" aria-hidden="true"></span>
        <span>Also Friday: <strong>Spanish vocab quiz</strong>, 91% ready</span></p>
    </section>

    <div class="side">
      <section class="sec reviews" aria-labelledby="rev-title">
        <div>
          <h2 id="rev-title">Reviews</h2>
          <p>32 cards, about 9 min</p>
        </div>
        <button class="btn btn-secondary" type="button">Start reviews</button>
      </section>

      <section class="sec" aria-labelledby="due-title">
        <h2 id="due-title">Due soon</h2>
        <ul class="rows">
          <li><label class="row">
            <input type="checkbox">
            <span>
              <span class="subj"><span class="dot" style="background: var(--algebra)" aria-hidden="true"></span>Algebra II</span>
              <span class="title">5.3 worksheet</span>
            </span>
            <span class="due">Tomorrow</span>
          </label></li>
          <li><label class="row">
            <input type="checkbox">
            <span>
              <span class="subj"><span class="dot" style="background: var(--english)" aria-hidden="true"></span>English</span>
              <span class="title">Gatsby essay draft</span>
            </span>
            <span class="due">Thu</span>
          </label></li>
          <li><label class="row">
            <input type="checkbox">
            <span>
              <span class="subj"><span class="dot" style="background: var(--chem)" aria-hidden="true"></span>Chem</span>
              <span class="title">Lab write-up</span>
            </span>
            <span class="due">Mon</span>
          </label></li>
        </ul>
      </section>
    </div>
  </div>
</main>
</body>
</html>
