<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today, highlighter direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #F8FAFD;
    --ink: #1B2A4A;
    --ink-2: #4A5874;
    --tint: #EEF3FA;
    --track: rgba(27, 42, 74, .06);
    --rule: #E3E9F2;
    --primary-bg: #1B2A4A;
    --primary-fg: #FFFFFF;
    --hl-bio: #7BE38A;
    --hl-algebra: #7CC8FF;
    --hl-spanish: #FF8FC8;
    --hl-english: #FFB65C;
    --hl-chem: #FFE45C;
    --hatch: rgba(31, 107, 54, .4);
    --hl-alpha: 1;
    --s1: 8px; --s2: 12px; --s3: 20px; --s4: 32px; --s5: 48px;
    --nav-h: 64px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #141B2B;
      --ink: #E6ECF7;
      --ink-2: #A8B4CB;
      --tint: #1C2539;
      --track: rgba(230, 236, 247, .07);
      --rule: #263049;
      --primary-bg: #E6ECF7;
      --primary-fg: #1B2A4A;
      --hatch: rgba(196, 245, 203, .45);
      --hl-alpha: .85;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  h1, h2, h3, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .display { font-family: "Bricolage Grotesque", system-ui, sans-serif; }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: var(--s4) var(--s3) calc(var(--nav-h) + var(--s5) + env(safe-area-inset-bottom));
  }
  .top { margin-bottom: var(--s4); }
  .top h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 24px; font-weight: 600; line-height: 1.2; }
  .top p { font-size: 15px; color: var(--ink-2); margin-top: 4px; }
  .grid { display: grid; gap: var(--s5); }
  .side { display: grid; gap: var(--s4); align-content: start; }

  .swatch {
    flex: none; display: inline-block; width: 6px; height: 22px; border-radius: 2px;
    opacity: var(--hl-alpha);
  }

  /* ---------- Hero: type on paper ---------- */
  .hero h2 { font-size: 34px; font-weight: 700; line-height: 1.08; letter-spacing: -0.01em; }
  .countdown { display: flex; align-items: baseline; gap: var(--s2); margin-top: var(--s1); }
  .countdown .day { font-size: 34px; font-weight: 400; line-height: 1.1; }
  .countdown .in { font-size: 15px; color: var(--ink-2); }

  .meter { position: relative; margin-top: var(--s5); }
  .goal-label {
    position: absolute; bottom: calc(100% + 10px); right: 10%;
    margin-right: -1px;
    font-size: 13px; color: var(--ink-2); white-space: nowrap; padding-right: var(--s1);
  }
  .strip { position: relative; height: 28px; border-radius: 3px; background: var(--track); }
  .strip svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: var(--hl-alpha); }
  .stroke { animation: draw 600ms cubic-bezier(.3, .7, .2, 1) both; }
  @keyframes draw {
    from { clip-path: inset(0 100% 0 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  .plan {
    position: absolute; top: 2px; bottom: 3px; left: 73.6%; width: 16.4%;
    background:
      repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, transparent 1.5px 7px),
      color-mix(in srgb, var(--hl-bio) 35%, transparent);
    opacity: var(--hl-alpha);
    border-radius: 0 3px 3px 0;
    animation: fade 300ms 450ms ease-out both;
  }
  @keyframes fade { from { opacity: 0; } }
  .tick { position: absolute; left: 90%; top: -8px; bottom: -8px; width: 2px; background: var(--ink); }

  .readiness { margin-top: var(--s3); text-wrap: balance; }
  .readiness span { color: var(--ink-2); display: inline-block; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    min-height: 48px; padding: 0 var(--s4);
    font: inherit; font-weight: 600; font-size: 17px;
    border-radius: 25px; cursor: pointer;
  }
  .btn-primary {
    height: 50px; margin-top: var(--s3); width: 100%;
    background: var(--primary-bg); color: var(--primary-fg); border: 0;
  }
  .btn-secondary {
    height: 50px; padding: 0 var(--s3);
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--ink);
  }

  .also { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3); font-size: 15px; color: var(--ink-2); }
  .also strong { color: var(--ink); font-weight: 600; }

  /* ---------- Reviews: a plain row, like the other directions ---------- */
  .sec h2 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 24px; font-weight: 600; line-height: 1.2; }
  .reviews { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
  .reviews h2 { font-size: 20px; }
  .reviews p { font-size: 15px; color: var(--ink-2); margin-top: 4px; }

  .rows { margin-top: var(--s1); }
  .row {
    display: grid; grid-template-columns: 22px 6px 1fr auto; align-items: center;
    column-gap: var(--s2); min-height: 64px; padding: var(--s1) 0; cursor: pointer;
  }
  .rows li + li .row { border-top: 1px solid var(--rule); }
  .row input { width: 22px; height: 22px; margin: 0; accent-color: var(--ink); cursor: pointer; }
  .row .title { display: block; font-size: 17px; line-height: 1.3; }
  .row .subj { display: block; font-size: 13px; color: var(--ink-2); }
  .row .due { font-size: 15px; color: var(--ink-2); }
  .row:has(input:checked) .title { text-decoration: line-through; color: var(--ink-2); }

  /* ---------- Nav ---------- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--page); border-top: 1px solid var(--rule);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav ul { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; }
  .nav a {
    position: relative;
    display: grid; justify-items: center; align-content: center; gap: 2px;
    height: var(--nav-h); color: var(--ink-2); text-decoration: none; font-size: 13px;
  }
  .nav a[aria-current="page"] { color: var(--ink); font-weight: 700; }
  .nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  @media (min-width: 1024px) {
    .nav { top: 0; right: auto; width: 104px; border-top: 0; border-right: 1px solid var(--rule); padding: var(--s4) 0; }
    .nav ul { display: grid; grid-template-columns: 1fr; gap: var(--s1); }
    .nav a { height: 72px; margin: 0 var(--s2); border-radius: 16px; }
    .nav a[aria-current="page"] { background: var(--tint); }
    .page { max-width: none; margin: 0 0 0 104px; padding: var(--s5); }
    .page > * { max-width: 1040px; margin-left: auto; margin-right: auto; }
    .top { margin-bottom: var(--s5); }
    .grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); column-gap: 72px; align-items: start; }
    .hero h2, .countdown .day { font-size: 44px; }
    .btn-primary { width: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <ul>
    <li><a href="#" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      Today</a></li>
    <li><a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="13" height="13" rx="2"/><path d="M8 4h10a2 2 0 0 1 2 2v10"/></svg>
      Decks</a></li>
    <li><a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Calendar</a></li>
    <li><a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V13M12 20V8M19 20V4"/></svg>
      Progress</a></li>
  </ul>
</nav>

<main class="page">
  <header class="top">
    <h1>Tuesday, Nov 10</h1>
    <p>12-day streak, 2 repairs left</p>
  </header>

  <div class="grid">
    <section class="hero" aria-labelledby="test-title">
      <h2 id="test-title" class="display">AP Bio unit 4 test</h2>
      <p class="countdown"><span class="day display">Friday</span><span class="in">in 3 days</span></p>

      <div class="meter" role="img" aria-label="Readiness 74% now, 90% by Friday if you keep this up, goal 90%">
        <span class="goal-label" aria-hidden="true">90% goal</span>
        <div class="strip">
          <svg class="stroke" viewBox="0 0 1000 28" preserveAspectRatio="none" aria-hidden="true">
            <path fill="var(--hl-bio)" d="M3,4 C140,2 290,5 440,3 C560,2 660,5 727,3 L737,5 L733,9 L740,13 L735,17 L741,21 L736,25 L725,26 C600,24 450,27 300,25 C180,24 80,26 2,25 C0,18 1,10 3,4 Z"/>
          </svg>
          <div class="plan"></div>
        </div>
        <span class="tick" aria-hidden="true"></span>
      </div>

      <p class="readiness">74% ready now. <span>90% by Friday if you keep this up.</span></p>
      <button class="btn btn-primary" type="button">Study for it</button>
      <p class="also"><span class="swatch" style="background: var(--hl-spanish)" aria-hidden="true"></span>
        <span>Also Friday: <strong>Spanish vocab quiz</strong>, 91% ready</span></p>
    </section>

    <div class="side">
      <section class="sec reviews" aria-labelledby="rev-title">
        <div>
          <h2 id="rev-title">Reviews</h2>
          <p>32 cards, about 9 min</p>
        </div>
        <button class="btn btn-secondary" type="button">Start reviews</button>
      </section>

      <section class="sec" aria-labelledby="due-title">
        <h2 id="due-title">Due soon</h2>
        <ul class="rows">
          <li><label class="row">
            <input type="checkbox">
            <span class="swatch" style="background: var(--hl-algebra)" aria-hidden="true"></span>
            <span><span class="subj">Algebra II</span><span class="title">5.3 worksheet</span></span>
            <span class="due">Tomorrow</span>
          </label></li>
          <li><label class="row">
            <input type="checkbox">
            <span class="swatch" style="background: var(--hl-english)" aria-hidden="true"></span>
            <span><span class="subj">English</span><span class="title">Gatsby essay draft</span></span>
            <span class="due">Thu</span>
          </label></li>
          <li><label class="row">
            <input type="checkbox">
            <span class="swatch" style="background: var(--hl-chem)" aria-hidden="true"></span>
            <span><span class="subj">Chem</span><span class="title">Lab write-up</span></span>
            <span class="due">Mon</span>
          </label></li>
        </ul>
      </section>
    </div>
  </div>
</main>
</body>
</html>
