<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nigiri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="highlighter.css">
</head>
<body>
<main class="screen has-bar">
  <header class="top">
    <div>
      <h1>Tuesday, Nov 10</h1>
      <!-- ?back: 3 or more calendar days since the last review or card made, with cards due (D45).
           Gone after the first rating that day. No guilt words. -->
      <p class="t-secondary" id="welcome" hidden>Welcome back.<br>The cards waiting longest come first.</p>
    </div>
    <a class="btn-icon" href="settings.html" aria-label="Settings" data-later>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </header>

  <div class="lead" id="lead">
    <a class="btn btn-primary" id="review" href="review-question.html" aria-describedby="lead-note">Review 18 cards</a>
    <!-- D41: the cost before the tap. Due-now count × 20 s (the fit check's number), rounded up:
         "Under a minute." below 60 s, "About 1 minute.", otherwise "About M minutes." -->
    <p class="t-secondary lead-note" id="lead-note"><span id="minutes">About 6 minutes.</span><br>Every rating saves, so you can stop anytime.</p>
  </div>

  <section class="sec" aria-labelledby="decks-title">
    <div class="sec-head">
      <h2 class="t-title" id="decks-title">Decks</h2>
      <a class="btn-text" href="new-deck.html">New deck</a>
    </div>
    <ul class="decks">
      <li><a class="deck" href="deck.html" style="--hl: var(--hl-green); --pen: var(--pen-green)">
        <span class="swatch" aria-hidden="true"></span>
        <span>
          <span class="name">AP Bio unit 4</span>
          <span class="sub" data-step1-text="12 cards">Test Friday</span>
        </span>
        <span class="due">8 due</span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
      </a></li>
      <li><a class="deck" href="deck.html" style="--hl: var(--hl-purple); --pen: var(--pen-purple)">
        <span class="swatch" aria-hidden="true"></span>
        <span>
          <span class="name">US History unit 2</span>
          <span class="sub" data-step1-text="35 cards">Test Friday</span>
        </span>
        <span class="due">6 due</span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
      </a></li>
      <li><a class="deck" href="deck.html" style="--hl: var(--hl-orange); --pen: var(--pen-orange)">
        <span class="swatch" aria-hidden="true"></span>
        <span>
          <span class="name">Gatsby vocab</span>
          <span class="sub">31 cards</span>
        </span>
        <span class="due">4 due</span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
      </a></li>
    </ul>
  </section>
</main>

<nav class="bar" aria-label="Make cards">
  <div class="bar-inner">
    <a class="btn btn-secondary btn-wide" id="add" href="add-card.html?from=home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add card</a>
  </div>
</nav>
<script>
  // ?clear: nothing is due right now. The Review button's place says so, a deck with nothing due
  // shows no count, and Add card becomes the main button (spec §6).
  if (new URLSearchParams(location.search).has('clear')) {
    document.getElementById('lead').innerHTML = '<p class="nothing">Nothing due right now</p>';
    document.querySelectorAll('.deck .due').forEach((d) => { d.textContent = ''; });
    document.getElementById('add').classList.replace('btn-secondary', 'btn-primary');
  }
  // ?back: welcome back after days away, with 47 cards waiting (47 × 20 s = 15.7, so about 16 minutes).
  if (new URLSearchParams(location.search).has('back')) {
    document.getElementById('welcome').hidden = false;
    document.getElementById('review').textContent = 'Review 47 cards';
    document.getElementById('minutes').textContent = 'About 16 minutes.';
    const due = ['19 due', '16 due', '12 due'];
    document.querySelectorAll('.deck .due').forEach((d, i) => { d.textContent = due[i]; });
  }
</script>
<script src="mockup.js"></script>
</body>
</html>
